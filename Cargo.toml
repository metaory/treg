[package]
name = "treg"
version = "1.1.0"
edition = "2024"
description = "Search $PATH by purpose"

[dependencies]
anyhow = "1"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
